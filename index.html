<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17181c"><title>Star Cast</title><link rel="stylesheet" href="styles.css"><style>.header-actions{display:flex;gap:7px}.avatar{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:linear-gradient(145deg,#f0b6cc,#a692ed);color:#362b43;font-size:14px;font-weight:700}</style>
  <style>.sheet[hidden]{display:none}.sleep-ai{margin:16px -3px 0;padding:17px;border-radius:21px;background:linear-gradient(135deg,rgba(157,143,255,.19),rgba(255,255,255,.04));border:1px solid rgba(177,166,255,.26)}.sleep-ai h3{margin:5px 0;font-size:16px}.sleep-ai p{margin:0}.sleep-ai .primary{margin-bottom:6px}.sleep-ai .choice{padding:10px 0;border:0;text-align:center;color:var(--muted)}.sleep-screen{min-height:540px;overflow:hidden;text-align:center;position:relative}.sleep-screen:before{content:"";position:absolute;inset:-30% -20%;background:radial-gradient(circle at 48% 44%,rgba(166,151,255,.22),transparent 28%),radial-gradient(circle at 74% 24%,rgba(223,122,165,.12),transparent 27%);pointer-events:none}.sleep-screen>*{position:relative}.sleep-canvas{display:block;width:100%;height:285px;margin:12px auto 0}.sleep-status{font-family:Fraunces,serif;font-size:28px;margin:0}.sleep-subtitle{max-width:27ch;margin:8px auto 0;color:var(--muted)}.sleep-cancel{margin-top:30px;color:var(--muted);min-height:44px}.recovery-art{width:88px;height:88px;border-radius:19px;object-fit:cover;margin:12px auto;display:block}.feedback-row{display:flex;gap:7px;margin-top:12px}.feedback-row button{flex:1;border:1px solid var(--line);border-radius:13px;padding:10px 5px;font-size:12px}@media(min-width:768px){body{background:radial-gradient(circle at 50% 0,rgba(157,143,255,.12),transparent 32%),var(--bg)}#app{max-width:680px;padding-left:30px;padding-right:30px}.mini,nav{left:max(24px,calc(50% - 310px));right:max(24px,calc(50% - 310px))}}</style>
</head>
<body>
  <main id="app" data-theme="dark">
    <div class="ambient"></div>
    <header><button class="wordmark" data-page="listen" aria-label="Star Cast home">STAR<span>✦</span>CAST</button><span class="header-actions"><button id="theme" class="icon" aria-label="Switch appearance">☼</button><button class="avatar" data-page="profile" aria-label="Open settings">O</button></span></header>
    <section id="view" aria-live="polite"></section>
    <section id="mini" class="mini glass" hidden></section>
    <nav class="glass" aria-label="Primary"><button data-page="listen">◉<small>Listen</small></button><button data-page="following">◌<small>Following</small></button><button data-page="search">⌕<small>Search</small></button><button data-page="library">▱<small>Library</small></button></nav>
    <div id="sheet" class="sheet" aria-modal="true" role="dialog" hidden></div>
    <div id="toast" role="status"></div>
  </main><script src="app.js"></script>
</body></html>
